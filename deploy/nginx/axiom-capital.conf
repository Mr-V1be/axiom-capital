server {
    listen 80;
    listen [::]:80;
    server_name axiom.135-181-248-246.sslip.io;

    root /var/www/axiom-capital/current/apps/web/dist;
    index index.html;
    charset utf-8;

    auth_basic "Axiom Capital";
    auth_basic_user_file /etc/nginx/axiom-capital.htpasswd;

    location /api/ {
        proxy_pass http://127.0.0.1:4400/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/axiom-capital.access.log;
    error_log /var/log/nginx/axiom-capital.error.log;
}
